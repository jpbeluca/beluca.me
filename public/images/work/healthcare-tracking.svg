<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#142a2d"/>
      <stop offset="0.55" stop-color="#0d1f25"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>
    <radialGradient id="hc-glow" cx="0.25" cy="0.75" r="0.7">
      <stop offset="0" stop-color="#8fc7c8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fc7c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#hc-bg)"/>
  <rect width="800" height="1000" fill="url(#hc-glow)"/>

  <!-- horizontal grid lines -->
  <g stroke="#7fb5b8" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="680" x2="800" y2="680"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- pulse waveform -->
  <g fill="none" stroke="#b5dadc" stroke-width="1.4" stroke-opacity="0.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M -20 500 L 120 500 L 160 500 L 180 460 L 210 540 L 240 380 L 270 620 L 300 480 L 340 500 L 460 500 L 490 460 L 520 540 L 550 380 L 580 620 L 610 480 L 650 500 L 820 500"/>
  </g>
  <g fill="none" stroke="#b5dadc" stroke-width="1" stroke-opacity="0.25">
    <path d="M -20 500 L 820 500"/>
  </g>

  <!-- RFID ripple circles -->
  <g fill="none" stroke="#b5dadc" stroke-opacity="0.45">
    <circle cx="640" cy="240" r="14" stroke-opacity="0.7"/>
    <circle cx="640" cy="240" r="34" stroke-opacity="0.4"/>
    <circle cx="640" cy="240" r="58" stroke-opacity="0.22"/>
    <circle cx="640" cy="240" r="88" stroke-opacity="0.12"/>
  </g>

  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="11" letter-spacing="2" fill="#7fb5b8" fill-opacity="0.5">
    <text x="48" y="80">RFID · IoT · EVENT-DRIVEN</text>
    <text x="48" y="100" fill-opacity="0.3">ingest.stream() →</text>
  </g>
</svg>
