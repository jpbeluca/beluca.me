<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gp-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fafaf3"/>
      <stop offset="0.55" stop-color="#f1e6d6"/>
      <stop offset="1" stop-color="#e3cdb0"/>
    </linearGradient>
    <radialGradient id="gp-glow" cx="0.78" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#a05a2a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#a05a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gp-grid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#a05a2a" fill-opacity="0.30"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#gp-bg)"/>
  <rect width="800" height="1000" fill="url(#gp-grid)"/>
  <rect width="800" height="1000" fill="url(#gp-glow)"/>

  <!-- gantt timeline: header rule + day ticks -->
  <g stroke="#a05a2a" stroke-opacity="0.35" stroke-width="1">
    <line x1="48" y1="200" x2="752" y2="200"/>
  </g>
  <g stroke="#a05a2a" stroke-opacity="0.22" stroke-width="1">
    <line x1="48"  y1="194" x2="48"  y2="206"/>
    <line x1="148" y1="194" x2="148" y2="206"/>
    <line x1="248" y1="194" x2="248" y2="206"/>
    <line x1="348" y1="194" x2="348" y2="206"/>
    <line x1="448" y1="194" x2="448" y2="206"/>
    <line x1="548" y1="194" x2="548" y2="206"/>
    <line x1="648" y1="194" x2="648" y2="206"/>
    <line x1="752" y1="194" x2="752" y2="206"/>
  </g>

  <!-- gantt task bars (sprint phases) -->
  <g>
    <!-- bar 1: completed -->
    <rect x="60"  y="226" width="180" height="22" fill="#a05a2a" fill-opacity="0.85" stroke="none"/>
    <rect x="60"  y="226" width="180" height="22" fill="none" stroke="#a05a2a" stroke-opacity="0.9" stroke-width="1.2"/>
    <!-- bar 2: in-progress (partial fill) -->
    <rect x="180" y="260" width="240" height="22" fill="none" stroke="#a05a2a" stroke-opacity="0.85" stroke-width="1.2"/>
    <rect x="180" y="260" width="140" height="22" fill="#a05a2a" fill-opacity="0.55" stroke="none"/>
    <!-- bar 3: planned (outline only) -->
    <rect x="290" y="294" width="200" height="22" fill="none" stroke="#a05a2a" stroke-opacity="0.65" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- bar 4: completed shorter -->
    <rect x="400" y="328" width="120" height="22" fill="#a05a2a" fill-opacity="0.18" stroke="#a05a2a" stroke-opacity="0.7" stroke-width="1.2"/>
    <!-- dependency arrows -->
    <g stroke="#a05a2a" stroke-opacity="0.55" stroke-width="1" fill="none">
      <path d="M 240 248 L 240 260"/>
      <path d="M 420 282 L 420 294"/>
      <path d="M 490 316 L 490 328"/>
    </g>
  </g>

  <!-- time tracker dial: concentric circles + hand, upper-right -->
  <g transform="translate(620 540)" fill="none" stroke="#a05a2a">
    <!-- outer faint ring -->
    <circle r="120" stroke-width="1.2" stroke-opacity="0.20"/>
    <circle r="96"  stroke-width="1.4" stroke-opacity="0.35"/>
    <!-- main dial ring -->
    <circle r="72"  stroke-width="1.8" stroke-opacity="0.9"/>
    <!-- minute ticks (every 30°) -->
    <g stroke-width="1.4" stroke-opacity="0.75">
      <line x1="0"   y1="-72" x2="0"   y2="-62"/>
      <line x1="62"  y1="0"   x2="72"  y2="0"/>
      <line x1="0"   y1="62"  x2="0"   y2="72"/>
      <line x1="-72" y1="0"   x2="-62" y2="0"/>
    </g>
    <g stroke-width="1" stroke-opacity="0.45">
      <line x1="36"  y1="-62" x2="31"  y2="-54"/>
      <line x1="62"  y1="-36" x2="54"  y2="-31"/>
      <line x1="62"  y1="36"  x2="54"  y2="31"/>
      <line x1="36"  y1="62"  x2="31"  y2="54"/>
      <line x1="-36" y1="62"  x2="-31" y2="54"/>
      <line x1="-62" y1="36"  x2="-54" y2="31"/>
      <line x1="-62" y1="-36" x2="-54" y2="-31"/>
      <line x1="-36" y1="-62" x2="-31" y2="-54"/>
    </g>
    <!-- elapsed arc (running session) -->
    <path d="M 0 -72 A 72 72 0 0 1 68 24" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round"/>
    <!-- hand -->
    <line x1="0" y1="0" x2="48" y2="-32" stroke-width="2" stroke-opacity="0.95"/>
    <!-- center pin -->
    <circle r="4" fill="#a05a2a" stroke="none"/>
  </g>

  <!-- productivity analytics sparkline (smooth curve with area fill) -->
  <g>
    <!-- baseline -->
    <line x1="48" y1="500" x2="752" y2="500" stroke="#a05a2a" stroke-opacity="0.18" stroke-width="1"/>

    <!-- area fill under curve -->
    <path d="M 48 478 C 110 470, 150 452, 200 444 S 290 470, 340 442 S 430 408, 488 420 S 580 444, 640 412 S 720 396, 752 402 L 752 500 L 48 500 Z"
          fill="#a05a2a" fill-opacity="0.12" stroke="none"/>

    <!-- curve stroke -->
    <path d="M 48 478 C 110 470, 150 452, 200 444 S 290 470, 340 442 S 430 408, 488 420 S 580 444, 640 412 S 720 396, 752 402"
          fill="none" stroke="#a05a2a" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- data points -->
    <g fill="#a05a2a">
      <circle cx="200" cy="444" r="2.8" fill-opacity="0.7"/>
      <circle cx="340" cy="442" r="2.8" fill-opacity="0.7"/>
      <circle cx="488" cy="420" r="2.8" fill-opacity="0.7"/>
      <circle cx="640" cy="412" r="2.8" fill-opacity="0.7"/>
      <!-- "now" marker -->
      <circle cx="752" cy="402" r="4" fill-opacity="1"/>
    </g>

    <!-- "now" cursor line -->
    <line x1="752" y1="396" x2="752" y2="510" stroke="#a05a2a" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- kanban columns hint at lower portion (textures, will sit under scrim) -->
  <g fill="none" stroke="#a05a2a" stroke-width="1.2">
    <!-- column headers -->
    <line x1="80"  y1="640" x2="240" y2="640" stroke-opacity="0.55"/>
    <line x1="270" y1="640" x2="430" y2="640" stroke-opacity="0.55"/>
    <line x1="460" y1="640" x2="620" y2="640" stroke-opacity="0.55"/>
    <!-- cards: To-do -->
    <rect x="80"  y="654" width="160" height="36" stroke-opacity="0.55"/>
    <rect x="80"  y="700" width="160" height="36" stroke-opacity="0.4"/>
    <!-- cards: Doing -->
    <rect x="270" y="654" width="160" height="36" fill="#a05a2a" fill-opacity="0.12" stroke-opacity="0.7"/>
    <rect x="270" y="700" width="160" height="36" stroke-opacity="0.5"/>
    <!-- cards: Done -->
    <rect x="460" y="654" width="160" height="36" fill="#a05a2a" fill-opacity="0.20" stroke-opacity="0.75"/>
  </g>

  <!-- mono labels top -->
  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="11" letter-spacing="2" fill="#0e1f3a" fill-opacity="0.55">
    <text x="48" y="86">GANTT · TIME · REAL-TIME</text>
    <text x="48" y="106" fill-opacity="0.3">ws.tick.subscribe()</text>
  </g>

  <!-- accent square corner marker -->
  <g transform="translate(48 870)" fill="none" stroke="#a05a2a" stroke-width="1.2" stroke-opacity="0.55">
    <rect width="14" height="14"/>
    <line x1="0" y1="22" x2="60" y2="22"/>
  </g>
</svg>
