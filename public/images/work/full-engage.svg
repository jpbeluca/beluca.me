<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fe-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fafaf3"/>
      <stop offset="0.55" stop-color="#eef0dc"/>
      <stop offset="1" stop-color="#dde5c8"/>
    </linearGradient>
    <radialGradient id="fe-glow" cx="0.78" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#3a5a40" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3a5a40" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fe-grid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#3a5a40" fill-opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#fe-bg)"/>
  <rect width="800" height="1000" fill="url(#fe-grid)"/>
  <rect width="800" height="1000" fill="url(#fe-glow)"/>

  <!-- planner timeline: faint horizontal week lanes -->
  <g stroke="#3a5a40" stroke-opacity="0.16" stroke-width="1">
    <line x1="48" y1="500" x2="752" y2="500"/>
    <line x1="48" y1="560" x2="752" y2="560"/>
    <line x1="48" y1="620" x2="752" y2="620"/>
    <line x1="48" y1="680" x2="752" y2="680"/>
    <line x1="48" y1="740" x2="752" y2="740"/>
  </g>

  <!-- planner column ticks (15-minute snap suggestion) -->
  <g stroke="#3a5a40" stroke-opacity="0.22" stroke-width="1">
    <line x1="48"  y1="494" x2="48"  y2="746"/>
    <line x1="188" y1="494" x2="188" y2="746"/>
    <line x1="328" y1="494" x2="328" y2="746"/>
    <line x1="468" y1="494" x2="468" y2="746"/>
    <line x1="608" y1="494" x2="608" y2="746"/>
    <line x1="752" y1="494" x2="752" y2="746"/>
  </g>

  <!-- scheduled blocks across two lanes (active client + ghost from non-active) -->
  <g>
    <!-- active client block -->
    <rect x="78" y="510" width="180" height="38" fill="#3a5a40" fill-opacity="0.85" stroke="none"/>
    <rect x="78" y="510" width="180" height="38" fill="none" stroke="#3a5a40" stroke-opacity="0.9" stroke-width="1.2"/>
    <!-- ghost block (non-active client, dashed) -->
    <rect x="290" y="570" width="150" height="38" fill="none" stroke="#3a5a40" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="4 4"/>
    <!-- another scheduled item -->
    <rect x="470" y="630" width="220" height="38" fill="#3a5a40" fill-opacity="0.18" stroke="#3a5a40" stroke-opacity="0.7" stroke-width="1.2"/>
    <!-- small task chip -->
    <rect x="120" y="690" width="86" height="32" fill="none" stroke="#3a5a40" stroke-opacity="0.55" stroke-width="1.2"/>
    <rect x="220" y="690" width="124" height="32" fill="#3a5a40" fill-opacity="0.10" stroke="#3a5a40" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>

  <!-- multi-tenant: nested workspace frames in upper-left, offset stack -->
  <g fill="none" stroke="#3a5a40" stroke-width="1.4">
    <rect x="60" y="160" width="240" height="150" stroke-opacity="0.22"/>
    <rect x="80" y="180" width="240" height="150" stroke-opacity="0.45"/>
    <rect x="100" y="200" width="240" height="150" stroke-opacity="0.85" fill="#3a5a40" fill-opacity="0.04"/>
    <!-- header bar inside top frame -->
    <line x1="100" y1="226" x2="340" y2="226" stroke-opacity="0.55"/>
    <!-- column rule for tasks/notes -->
    <line x1="180" y1="226" x2="180" y2="350" stroke-opacity="0.35"/>
    <!-- row hints -->
    <line x1="180" y1="252" x2="328" y2="252" stroke-opacity="0.25"/>
    <line x1="180" y1="278" x2="328" y2="278" stroke-opacity="0.25"/>
    <line x1="180" y1="304" x2="328" y2="304" stroke-opacity="0.25"/>
    <!-- small status dots -->
    <circle cx="118" cy="252" r="3" fill="#3a5a40" fill-opacity="0.85" stroke="none"/>
    <circle cx="118" cy="278" r="3" fill="#3a5a40" fill-opacity="0.55" stroke="none"/>
    <circle cx="118" cy="304" r="3" fill="#3a5a40" fill-opacity="0.3"  stroke="none"/>
  </g>

  <!-- emblem: circle containing square (Full Engage logo motif, outline only), upper-right -->
  <g fill="none" stroke="#3a5a40">
    <!-- outer scope rings (org → workspace → client) -->
    <circle cx="570" cy="230" r="138" stroke-width="1.2" stroke-opacity="0.18"/>
    <circle cx="570" cy="230" r="116" stroke-width="1.3" stroke-opacity="0.35"/>
    <!-- main emblem ring -->
    <circle cx="570" cy="230" r="92" stroke-width="1.8" stroke-opacity="0.9"/>
    <!-- inner square -->
    <rect x="514" y="174" width="112" height="112" stroke-width="1.6" stroke-opacity="0.75"/>
    <!-- center dot -->
    <circle cx="570" cy="230" r="3.5" fill="#3a5a40" stroke="none"/>
  </g>

  <!-- tool-call/chat connector: from emblem down toward planner -->
  <g stroke="#3a5a40" stroke-width="1.2" fill="none">
    <path d="M 570 326 L 570 420 L 168 420 L 168 510" stroke-opacity="0.55" stroke-dasharray="3 4"/>
    <circle cx="168" cy="510" r="3.5" fill="#3a5a40" stroke="none"/>
    <circle cx="570" cy="326" r="3.5" fill="#3a5a40" stroke="none"/>
  </g>

  <!-- mono labels top -->
  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="11" letter-spacing="2" fill="#0e1f3a" fill-opacity="0.55">
    <text x="48" y="86">PLANNER · MULTI-TENANT · AI</text>
    <text x="48" y="106" fill-opacity="0.3">engage.client.scope()</text>
  </g>

  <!-- accent square corner marker -->
  <g transform="translate(48 870)" fill="none" stroke="#3a5a40" stroke-width="1.2" stroke-opacity="0.55">
    <rect width="14" height="14"/>
    <line x1="0" y1="22" x2="60" y2="22"/>
  </g>
</svg>
