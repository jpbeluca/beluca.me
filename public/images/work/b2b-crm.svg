<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2638"/>
      <stop offset="0.6" stop-color="#0e1a2c"/>
      <stop offset="1" stop-color="#070e1c"/>
    </linearGradient>
    <radialGradient id="bc-glow" cx="0.75" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#9ab2d6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9ab2d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bc-bg)"/>
  <rect width="800" height="1000" fill="url(#bc-glow)"/>

  <g stroke="#9ab2d6" stroke-opacity="0.22" stroke-width="1" fill="none">
    <!-- isometric grid -->
    <g transform="translate(0 280)">
      <path d="M 0 0 L 800 -240"/>
      <path d="M 0 60 L 800 -180"/>
      <path d="M 0 120 L 800 -120"/>
      <path d="M 0 180 L 800 -60"/>
      <path d="M 0 240 L 800 0"/>
      <path d="M 0 300 L 800 60"/>
      <path d="M 0 360 L 800 120"/>
      <path d="M 0 420 L 800 180"/>
      <path d="M 0 480 L 800 240"/>

      <path d="M 0 0 L 800 240" stroke-opacity="0.14"/>
      <path d="M 0 60 L 800 300" stroke-opacity="0.14"/>
      <path d="M 0 120 L 800 360" stroke-opacity="0.14"/>
      <path d="M 0 180 L 800 420" stroke-opacity="0.14"/>
      <path d="M 0 240 L 800 480" stroke-opacity="0.14"/>
    </g>
  </g>

  <!-- stacked block silhouette -->
  <g fill="none" stroke="#c4d3ee" stroke-opacity="0.65" stroke-width="1.2">
    <polygon points="400,140 560,220 560,400 400,320"/>
    <polygon points="400,140 240,220 240,400 400,320" stroke-opacity="0.45"/>
    <polygon points="240,220 400,320 560,220" stroke-opacity="0.85"/>
    <polygon points="430,250 540,304 540,440 430,386" stroke-opacity="0.35"/>
    <polygon points="370,300 270,348 270,490 370,442" stroke-opacity="0.3"/>
  </g>

  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="11" letter-spacing="2" fill="#9ab2d6" fill-opacity="0.45">
    <text x="48" y="80">CRM · ERP · OPERATIONS</text>
    <text x="48" y="100" fill-opacity="0.28">aws.region us-east-1</text>
  </g>
</svg>
