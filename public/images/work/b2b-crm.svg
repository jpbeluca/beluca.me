<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bc-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fafaf3"/>
      <stop offset="0.5" stop-color="#e6e9ef"/>
      <stop offset="1" stop-color="#cdd5e2"/>
    </linearGradient>
    <radialGradient id="bc-glow" cx="0.25" cy="0.78" r="0.65">
      <stop offset="0" stop-color="#0e1f3a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0e1f3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bc-bg)"/>
  <rect width="800" height="1000" fill="url(#bc-glow)"/>

  <!-- isometric grid (subtle) -->
  <g stroke="#0e1f3a" stroke-opacity="0.10" stroke-width="1" fill="none">
    <g transform="translate(0 300)">
      <path d="M 0 0 L 800 -240"/>
      <path d="M 0 60 L 800 -180"/>
      <path d="M 0 120 L 800 -120"/>
      <path d="M 0 180 L 800 -60"/>
      <path d="M 0 240 L 800 0"/>
      <path d="M 0 300 L 800 60"/>
      <path d="M 0 360 L 800 120"/>
      <path d="M 0 420 L 800 180"/>
      <path d="M 0 480 L 800 240"/>

      <path d="M 0 0 L 800 240" stroke-opacity="0.7"/>
      <path d="M 0 60 L 800 300" stroke-opacity="0.7"/>
      <path d="M 0 120 L 800 360" stroke-opacity="0.7"/>
      <path d="M 0 180 L 800 420" stroke-opacity="0.7"/>
      <path d="M 0 240 L 800 480" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- isometric stacked blocks (strong) -->
  <g fill="none" stroke="#0e1f3a" stroke-width="1.6">
    <!-- main block -->
    <polygon points="400,170 580,260 580,440 400,350" stroke-opacity="0.9"/>
    <polygon points="400,170 220,260 220,440 400,350" stroke-opacity="0.7"/>
    <polygon points="220,260 400,350 580,260" stroke-opacity="1"/>

    <!-- accent fills on faces -->
    <polygon points="400,170 580,260 580,440 400,350" fill="#0e1f3a" fill-opacity="0.05" stroke="none"/>
    <polygon points="400,170 220,260 220,440 400,350" fill="#0e1f3a" fill-opacity="0.10" stroke="none"/>

    <!-- secondary smaller block lower-right -->
    <polygon points="450,290 560,344 560,470 450,418" stroke-opacity="0.45" stroke-width="1.3"/>
    <!-- secondary smaller block lower-left -->
    <polygon points="350,330 270,368 270,490 350,452" stroke-opacity="0.4" stroke-width="1.3"/>

    <!-- top accent line -->
    <line x1="400" y1="170" x2="400" y2="120" stroke-opacity="0.55"/>
    <circle cx="400" cy="116" r="4" fill="#0e1f3a" stroke="none"/>
  </g>

  <!-- mono labels top -->
  <g font-family="ui-monospace, 'Geist Mono', monospace" font-size="11" letter-spacing="2" fill="#0e1f3a" fill-opacity="0.55">
    <text x="48" y="86">CRM · ERP · OPERATIONS</text>
    <text x="48" y="106" fill-opacity="0.3">aws.region us-east-1</text>
  </g>

  <!-- accent corner mark -->
  <g transform="translate(48 870)" fill="none" stroke="#0e1f3a" stroke-width="1.2" stroke-opacity="0.5">
    <rect width="14" height="14"/>
    <line x1="0" y1="22" x2="60" y2="22"/>
  </g>
</svg>
